# 로컬 원클릭 실행: cp .env.example .env → 키 입력 → docker compose up -d --build --wait → http://localhost:3000
#
#   web (3000, 밖으로 열림) → api (8000, 에이전트·브리핑 승인) → mcp (8001, 영화 데이터 도구 4개)
#                                     └→ postgres (대화 체크포인트·브리핑 상태)
#
# 브라우저는 web만 본다. web/app/api/chat/route.ts가 서버 쪽에서 BACKEND_URL로 프록시하므로
# api·mcp 포트는 밖으로 열지 않는다(CORS 설정도 필요 없다).
#
# 키는 서비스마다 필요한 것만 준다(.env에서 읽어 넣는다). KOBIS·Tavily 키는 mcp만 갖는다.
#
# 배포(Vercel·Railway)는 이 파일을 쓰지 않는다. Railway는 MCP_URL이 없어 로컬 도구를 쓴다.

# 폴더 이름(claude 등)이 아니라 고정 이름으로 컨테이너·볼륨을 만든다.
name: movie-chatbot

services:
  postgres:
    image: postgres:16
    environment:
      # compose 내부 네트워크에서만 쓰고 포트를 밖으로 열지 않는다.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: movies
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d movies"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  mcp:
    build: &app-build
      context: .
      # 루트가 아니라 docker/에 둔다. 루트에 Dockerfile이 있으면 Railway 배포가 실패한다.
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "movie_mcp.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}   # 검색어 임베딩
      KOBIS_API_KEY: ${KOBIS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Host 헤더 검사(DNS 리바인딩 방어)에 compose 서비스 이름을 더한다. movie_mcp/server.py 참고.
      MCP_ALLOWED_HOSTS: "mcp:*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # FAISS 인덱스. down 후 다시 올려도 임베딩을 다시 하지 않는다. 지우려면 docker compose down -v.
      - movie_index:/app/vectorstore
    healthcheck:
      # 벡터스토어가 준비돼야 200이다. 처음 뜰 때 영화 250편을 임베딩하는 동안은 실패로 세지 않는다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 180s
    restart: unless-stopped

  api:
    build: *app-build
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MCP_URL: http://mcp:8001/mcp
      # 대화 체크포인트와 브리핑 상태를 Postgres에. 승인 대기 중에 api가 재시작돼도 이어진다.
      DATABASE_URL: postgresql://app:app@postgres:5432/movies
      # 브리핑 승인 API(/briefings)의 관리자 토큰. 없으면 승인 API가 503.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 승인된 브리핑을 보낼 Discord 웹훅. 없으면 보내지 않고 기록만 한다.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # 승인 요청·실패 알림용 웹훅(브리핑 채널과 따로 두면 좋다). 없으면 알리지 않는다.
      DISCORD_REVIEW_WEBHOOK_URL: ${DISCORD_REVIEW_WEBHOOK_URL:-}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3000/admin/briefings}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      # 기동할 때 MCP 서버에서 도구 목록을 받으므로 mcp가 먼저 준비돼야 한다.
      mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # /health는 에이전트·OpenAI 키·MCP 도구 4개가 준비돼야 200이다(server.py).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 주간 브리핑 트리거. `docker compose --profile automation up`일 때만 뜬다.
  # 시각에 맞춰 api의 /briefings/run을 부르고 실패하면 알리기만 한다. 에이전트 실행·승인 대기·발송·중복 방지는
  # 전부 api가 맡는다 — 트리거를 GitHub Actions cron 등으로 바꿔도 HTTP 호출 하나만 옮기면 된다.
  n8n:
    image: n8nio/n8n:2.43.7
    profiles: [automation]
    # 기동할 때마다 저장소의 워크플로를 가져와 켠다. 화면에서 고친 내용은 다음 기동 때 덮어써지므로
    # 바꾸려면 automation/n8n/weekly-briefing.json을 고친다(저장소가 단일 출처).
    entrypoint: ["sh", "-c", "n8n import:workflow --input=/workflows/weekly-briefing.json && n8n publish:workflow --id=WeeklyBriefing01 && exec n8n start"]
    environment:
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      # 워크플로가 $env로 아래 값을 읽는다(n8n 2.x는 기본으로 막혀 있다).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      BRIEFING_API_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DISCORD_REVIEW_WEBHOOK_URL: ${DISCORD_REVIEW_WEBHOOK_URL:-}
      N8N_SECURE_COOKIE: "false"  # 로컬 http로 화면을 열기 위해
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  movie_index:
  pg_data:
  n8n_data:
