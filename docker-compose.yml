# 로컬 원클릭 실행: cp .env.example .env → 키 입력 → docker compose up --wait → http://localhost:3000
#
# 브라우저는 web만 본다. web/app/api/chat/route.ts가 서버 쪽에서 BACKEND_URL로 프록시하므로
# api 포트는 밖으로 열지 않는다(CORS 설정도 필요 없다).
#
# 배포(Vercel·Railway)는 이 파일을 쓰지 않는다.

# 폴더 이름(claude 등)이 아니라 고정 이름으로 컨테이너·볼륨을 만든다.
name: movie-chatbot

services:
  api:
    build: .
    env_file: .env
    volumes:
      # FAISS 인덱스와 대화 DB. down 후 다시 올려도 임베딩을 다시 하지 않고 대화도 이어진다.
      # 지우려면 docker compose down -v.
      - vectorstore:/app/vectorstore
    healthcheck:
      # /health는 OpenAI 키·벡터스토어·에이전트가 준비돼야 200이다(server.py). KOBIS·Tavily 키만
      # 없으면 degraded(200)로 뜨고 해당 도구만 실패한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 6
      # 처음 뜰 때 영화 250편을 임베딩한다(볼륨이 비어 있을 때만). 그동안은 실패로 세지 않는다.
      start_period: 180s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vectorstore:
