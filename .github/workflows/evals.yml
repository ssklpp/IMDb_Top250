name: Agent Evals

# 에이전트 회귀 평가. ci.yml과 분리한 이유는 **실제 비용이 들기 때문**이다.
# 골든셋 14개 전부가 OpenAI/Tavily/KOBIS를 실호출하고, 벡터스토어 캐시가 없으면
# PDF 임베딩 생성까지 한다. 그래서 기본은 수동 실행이다.
#
# 자동 실행을 원하면 아래 트리거의 주석을 풀면 된다. 다만 푸시마다 과금된다.
on:
  workflow_dispatch:
    inputs:
      judge:
        description: "LLM-as-judge 채점 포함 (비용 약 2배)"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "0 0 * * 1"   # 매주 월요일

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false # 과금되는 실행이라 중간에 끊지 않는다

jobs:
  evals:
    name: 골든셋 회귀 평가
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 시크릿이 없으면 langchain 내부에서 알아보기 힘든 예외로 죽는다.
      # 먼저 확인해 원인을 명확히 알린다.
      - name: 시크릿 확인
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        run: |
          missing=""
          [ -z "$OPENAI_API_KEY" ] && missing="$missing OPENAI_API_KEY"
          [ -z "$TAVILY_API_KEY" ] && missing="$missing TAVILY_API_KEY"
          [ -z "$KOBIS_API_KEY" ] && missing="$missing KOBIS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없습니다:$missing — Settings > Secrets and variables > Actions에서 추가하세요."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # vectorstore/는 gitignore라 CI에 없다. 캐시가 없으면 매 실행마다
      # PDF를 다시 임베딩해 시간과 비용이 든다.
      # 청크 파라미터(chunk_size 등)를 바꾸면 캐시가 낡으므로 아래 v1을 v2로 올릴 것.
      - name: 벡터스토어 캐시
        uses: actions/cache@v4
        with:
          path: vectorstore
          key: vectorstore-v1-${{ hashFiles('imdb_top250.pdf') }}

      - name: 평가 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ inputs.judge }}" = "true" ]; then
            python -m tests.evals.run_evals | tee evals-result.txt
          else
            python -m tests.evals.run_evals --skip-judge | tee evals-result.txt
          fi

      # 실패해도 결과를 남긴다. 어떤 항목이 왜 깨졌는지 봐야 하기 때문이다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 평가 결과"
            echo '```'
            grep -E "PASS\]|FAIL\]|결과:" evals-result.txt || cat evals-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 전체 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-result
          path: evals-result.txt
          retention-days: 14
